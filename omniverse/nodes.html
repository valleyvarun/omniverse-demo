<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nodes</title>
  <link rel="stylesheet" href="nodes.css" />
</head>
<body>
  <div id="world">
    <div id="node1" class="node">
      <!-- Header with Omniverse logo -->
      <div class="node-header">
        <img src="../logo/omniverse-logo.png" alt="Omniverse" class="node-logo">
        <span class="node-header-text">Plexus</span>
      </div>
      
      <!-- Content area -->
      <div class="node-content">
        <!-- Left side - Inputs -->
        <div class="inputs">
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">run</div>
          </div>
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">file name</div>
          </div>
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">folder</div>
          </div>
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">version</div>
          </div>
        </div>
        
        <!-- Center - Node Name -->
        <div class="node-name">
          <img src="../logo/store-logo.png" alt="Plexus" class="center-logo">
        </div>
        
        <!-- Right side - Outputs -->
        <div class="outputs">
          <div class="output-item">
            <div class="output-label">work</div>
            <div class="output-circle"></div>
          </div>
          <div class="output-item">
            <div class="output-label">users</div>
            <div class="output-circle"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- True/False Node -->
    <div id="node2" class="node boolean-node">
      <!-- Content area -->
      <div class="boolean-content">
        <!-- Left side - Toggle Button -->
        <div class="boolean-left">
          <button type="button" class="boolean-toggle" onclick="toggleBoolean(event, this)">false</button>
        </div>
        
        <!-- Right side - Output Circle -->
        <div class="boolean-right">
          <div class="output-circle"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Current world transform (provided by parent)
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    // World/nodes setup
    const world = document.getElementById('world');
    const nodeEls = Array.from(document.querySelectorAll('.node'));
    // Store world-space positions for each node by id
    const nodePos = {};

    // Initialize node positions from computed styles (left/top from CSS) or defaults
    nodeEls.forEach(el => {
      const cs = getComputedStyle(el);
      const wx = parseFloat(cs.left) || 0;
      const wy = parseFloat(cs.top) || 0;
      nodePos[el.id] = { x: wx, y: wy };
      // Ensure positions are applied inline so future updates are consistent
      el.style.left = wx + 'px';
      el.style.top  = wy + 'px';
    });

    function updateWorldTransform() {
      world.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }

    function updateAllNodePositions() {
      nodeEls.forEach(el => {
        const p = nodePos[el.id];
        if (!p) return;
        el.style.left = p.x + 'px';
        el.style.top  = p.y + 'px';
      });
      publishNodesState();
    }

    // Drag handling in screen space, convert to world space by dividing by scale
    let dragging = false;
    let draggingNodeId = null;
    let dragStartSX = 0, dragStartSY = 0; // screen
    let startWX = 0, startWY = 0; // world

    // Attach drag handlers to all nodes
    nodeEls.forEach(el => {
      el.addEventListener('mousedown', (e) => {
        // Only left or middle button
        if (e.button !== 0 && e.button !== 1) return;
        // Don't start dragging when interacting with controls (e.g., buttons inside node)
        if (e.target.closest('button, input, textarea, select')) return;
        e.preventDefault();
        dragging = true;
        draggingNodeId = el.id;
        dragStartSX = e.clientX;
        dragStartSY = e.clientY;
        const p = nodePos[draggingNodeId] || { x: 0, y: 0 };
        startWX = p.x;
        startWY = p.y;
      });
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const dSX = e.clientX - dragStartSX;
      const dSY = e.clientY - dragStartSY;
      const nx = startWX + dSX / scale; // convert screen delta to world delta
      const ny = startWY + dSY / scale;
      if (draggingNodeId && nodePos[draggingNodeId]) {
        nodePos[draggingNodeId].x = nx;
        nodePos[draggingNodeId].y = ny;
        updateAllNodePositions();
      }
    });
    window.addEventListener('mouseup', () => { dragging = false; draggingNodeId = null; });

    function publishNodesState() {
      try {
        const payload = Object.entries(nodePos).map(([id, p]) => ({ id, x: p.x, y: p.y }));
        window.top.postMessage({ type: 'nodes:state', nodes: payload }, '*');
      } catch (_) {}
    }

    // Request saved node state from top on load
    try { window.top.postMessage({ type: 'nodes:requestState' }, '*'); } catch (_) {}

    // Apply restored nodes positions
    window.addEventListener('message', (ev) => {
      const data = ev.data || {};
      if (data.type === 'nodes:restore' && Array.isArray(data.nodes)) {
        data.nodes.forEach(n => {
          if (!n || typeof n.id !== 'string') return;
          if (typeof n.x === 'number' && typeof n.y === 'number') {
            nodePos[n.id] = { x: n.x, y: n.y };
          }
        });
        updateAllNodePositions();
      }
    });

    // Receive world transform from parent
    window.addEventListener('message', (ev) => {
      const data = ev.data || {};
      if (data.type === 'world:transform') {
        scale = data.scale;
        offsetX = data.offsetX;
        offsetY = data.offsetY;
        updateWorldTransform();
      }
    });

    // Forward wheel events to parent so zoom works over the nodes layer too
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      // Send to parent (plexus.html), not top, so it can handle zoom
      window.parent.postMessage({ type: 'world:wheel', clientX: e.clientX, clientY: e.clientY, deltaY: e.deltaY }, '*');
    }, { passive: false });

    // Any click inside nodes iframe should route focus back to the command line in the top window
    document.addEventListener('click', () => {
      try {
        window.top.postMessage({ type: 'focusCommand' }, '*');
      } catch (_) {}
    });

    // Background panning support: when clicking NOT on a node, pan the world via parent
    let bgPanning = false;
    document.addEventListener('mousedown', (e) => {
      // Ignore if starting on a node (node dragging takes priority)
      if (e.target.closest('.node')) return;
      // Only left or middle button
      if (e.button !== 0 && e.button !== 1) return;
      e.preventDefault();
      bgPanning = true;
      window.parent.postMessage({ type: 'world:panStart', clientX: e.clientX, clientY: e.clientY }, '*');
    });
    window.addEventListener('mousemove', (e) => {
      if (!bgPanning) return;
      window.parent.postMessage({ type: 'world:panMove', clientX: e.clientX, clientY: e.clientY }, '*');
    });
    window.addEventListener('mouseup', () => {
      if (!bgPanning) return;
      bgPanning = false;
      window.parent.postMessage({ type: 'world:panEnd' }, '*');
    });

    // Initial paint
  updateWorldTransform();
  updateAllNodePositions();

    // Boolean toggle function
    function toggleBoolean(e, button) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if ((button.textContent || '').trim().toLowerCase() === 'false') {
        button.textContent = 'true';
        button.classList.add('true');
      } else {
        button.textContent = 'false';
        button.classList.remove('true');
      }
    }
  </script>
</body>
</html>
