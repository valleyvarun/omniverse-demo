<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nodes</title>
  <link rel="stylesheet" href="nodes.css" />
</head>
<body>
  <div id="world">
    <div id="node1" class="node">
      <!-- Header with Omniverse logo -->
      <div class="node-header">
        <img src="../logo/omniverse-logo.png" alt="Omniverse" class="node-logo">
        <span class="node-header-text">Plexus</span>
      </div>
      
      <!-- Content area -->
      <div class="node-content">
        <!-- Left side - Inputs -->
        <div class="inputs">
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">run</div>
          </div>
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">file name</div>
          </div>
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">folder</div>
          </div>
          <div class="input-item">
            <div class="input-circle"></div>
            <div class="input-label">version</div>
          </div>
        </div>
        
        <!-- Center - Node Name -->
        <div class="node-name">
          <img src="../logo/store-logo.png" alt="Plexus" class="center-logo">
        </div>
        
        <!-- Right side - Outputs -->
        <div class="outputs">
          <div class="output-item">
            <div class="output-label">work</div>
            <div class="output-circle"></div>
          </div>
          <div class="output-item">
            <div class="output-label">users</div>
            <div class="output-circle"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- True/False Node -->
    <div id="node2" class="node boolean-node">
      <!-- Content area -->
      <div class="boolean-content">
        <!-- Left side - Toggle Button -->
        <div class="boolean-left">
          <button type="button" class="boolean-toggle" onclick="toggleBoolean(event, this)">false</button>
        </div>
        
        <!-- Right side - Output Circle -->
        <div class="boolean-right">
          <div class="output-circle"></div>
        </div>
      </div>
    </div>

    <!-- Text Nodes -->
    <!-- Text node: editable text field with line numbers, resize handles, and output connector -->
    <div id="node3" class="node text-node" data-node-type="text">
      <!-- Header bar with node type label -->
      <div class="node-header">
        <span class="node-header-text">Text</span>
      </div>
      
      <!-- Main body: contains text editor and right-side column for resize/output -->
      <div class="text-node-body">
        <!-- Text editor block: line numbers + editable content area -->
        <div class="text-block">
          <div class="line-numbers"></div> <!-- Auto-generated line numbers (1, 2, 3...) -->
          <div class="text-content" data-node-id="node3">ProjectWorkflow.cs</div> <!-- Editable text (double-click to edit) -->
        </div>
        
        <!-- Right side column: vertical resize bar + output connector -->
        <div class="text-side-column">
          <!-- Vertical resize bar (drag to adjust node width) -->
          <div class="text-resize-bar">
            <div class="resize-handle resize-handle-right" data-direction="e" aria-label="Resize text node right edge"></div>
          </div>
          <!-- Output connector circle (aligned to right edge, consistent spacing) -->
          <div class="text-node-output">
            <div class="output-circle"></div>
          </div>
        </div>
      </div>
      
      <!-- Horizontal resize bar (drag bottom edge to adjust height) -->
      <div class="resize-handle resize-handle-bottom" data-direction="s" aria-label="Resize text node bottom edge"></div>
      <!-- Corner resize square (drag to resize both width and height) -->
      <div class="resize-handle resize-handle-corner" data-direction="se" aria-label="Resize text node corner"></div>
    </div>

    <!-- Second text node (same structure as above) -->
    <div id="node4" class="node text-node" data-node-type="text">
      <div class="node-header">
        <span class="node-header-text">Text</span>
      </div>
      <div class="text-node-body">
        <div class="text-block">
          <div class="line-numbers"></div>
          <div class="text-content" data-node-id="node4">O:\Projects\2025\Workflow\Release</div>
        </div>
        <div class="text-side-column">
          <div class="text-resize-bar">
            <div class="resize-handle resize-handle-right" data-direction="e" aria-label="Resize text node right edge"></div>
          </div>
          <div class="text-node-output">
            <div class="output-circle"></div>
          </div>
        </div>
      </div>
      <div class="resize-handle resize-handle-bottom" data-direction="s" aria-label="Resize text node bottom edge"></div>
      <div class="resize-handle resize-handle-corner" data-direction="se" aria-label="Resize text node corner"></div>
    </div>
  </div>

  <script>
  // Current world transform (provided by parent)
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;

    // World/nodes setup
    const world = document.getElementById('world');
    const nodeEls = Array.from(document.querySelectorAll('.node'));
    // Store world-space positions for each node by id
    const nodePos = {};

    // Enable inline editing for text nodes on double-click
    let editingTextBlock = false;
    const textEditors = Array.from(document.querySelectorAll('.text-content'));
    textEditors.forEach(editor => {
      editor.setAttribute('contenteditable', 'false');
      editor.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
        startEditingTextBlock(editor);
      });
      editor.addEventListener('blur', () => endEditingTextBlock(editor));
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          editor.blur();
        }
      });
      editor.addEventListener('input', () => updateLineNumbers(editor));
      updateLineNumbers(editor);
    });

    function startEditingTextBlock(editor) {
      editingTextBlock = true;
      const block = editor.closest('.text-block');
      if (block) block.classList.add('editing');
      editor.classList.add('editing');
      editor.setAttribute('contenteditable', 'true');
      editor.focus();
      // move caret to end
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function endEditingTextBlock(editor) {
      if (!editingTextBlock) return;
      const block = editor.closest('.text-block');
      if (block) block.classList.remove('editing');
      editor.classList.remove('editing');
      editor.setAttribute('contenteditable', 'false');
      editingTextBlock = false;
      updateLineNumbers(editor);
      try {
        window.top.postMessage({ type: 'focusCommand' }, '*');
      } catch (_) {}
    }

    function updateLineNumbers(editor) {
      const block = editor.closest('.text-block');
      if (!block) return;
      const column = block.querySelector('.line-numbers');
      if (!column) return;
      const text = editor.innerText.replace(/\u00a0/g, ' ');
      const lines = text.split(/\n/);
      const count = Math.max(1, lines.length);
      column.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const line = document.createElement('div');
        line.textContent = i;
        column.appendChild(line);
      }
    }

    // Boolean node state persistence
    const booleanButton = document.querySelector('#node2 .boolean-toggle');
    function readBooleanState() {
      try {
        const val = localStorage.getItem('boolean:node2');
        if (val === 'true') return true;
        if (val === 'false') return false;
      } catch (_) {}
      return null;
    }
    function applyBooleanState(state) {
      if (!booleanButton) return;
      if (state === true) {
        booleanButton.textContent = 'true';
        booleanButton.classList.add('true');
      } else if (state === false) {
        booleanButton.textContent = 'false';
        booleanButton.classList.remove('true');
      }
    }

    // Initialize node positions from computed styles (left/top from CSS) or defaults
    nodeEls.forEach(el => {
      const cs = getComputedStyle(el);
      const wx = parseFloat(cs.left) || 0;
      const wy = parseFloat(cs.top) || 0;
      nodePos[el.id] = { x: wx, y: wy };
      // Ensure positions are applied inline so future updates are consistent
      el.style.left = wx + 'px';
      el.style.top  = wy + 'px';
    });

    function updateWorldTransform() {
      world.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }

    function updateAllNodePositions() {
      nodeEls.forEach(el => {
        const p = nodePos[el.id];
        if (!p) return;
        el.style.left = p.x + 'px';
        el.style.top  = p.y + 'px';
      });
      publishNodesState();
    }

    // Drag handling in screen space, convert to world space by dividing by scale
    let dragging = false;
    let draggingNodeId = null;
    let dragStartSX = 0, dragStartSY = 0; // screen
    let startWX = 0, startWY = 0; // world
    // Resize handling
    let resizing = false;
    let resizingNode = null;
    let resizeStartSX = 0, resizeStartSY = 0;
    let resizeStartWidth = 0, resizeStartHeight = 0;
    let resizeDirection = 'se';

    // Attach drag handlers to all nodes
    nodeEls.forEach(el => {
      el.addEventListener('mousedown', (e) => {
        // Only left or middle button
        if (e.button !== 0 && e.button !== 1) return;
        // Don't start dragging when interacting with controls (e.g., buttons inside node)
        if (e.target.closest('button, input, textarea, select, .text-block, .text-content')) return;
        e.preventDefault();
        // Bring clicked node to front
        nodeEls.forEach(n => n.style.zIndex = '1');
        el.style.zIndex = '10';
        dragging = true;
        draggingNodeId = el.id;
        dragStartSX = e.clientX;
        dragStartSY = e.clientY;
        const p = nodePos[draggingNodeId] || { x: 0, y: 0 };
        startWX = p.x;
        startWY = p.y;
      });
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const dSX = e.clientX - dragStartSX;
      const dSY = e.clientY - dragStartSY;
      const nx = startWX + dSX / scale; // convert screen delta to world delta
      const ny = startWY + dSY / scale;
      if (draggingNodeId && nodePos[draggingNodeId]) {
        nodePos[draggingNodeId].x = nx;
        nodePos[draggingNodeId].y = ny;
        updateAllNodePositions();
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (!resizing || !resizingNode) return;
      const dSX = e.clientX - resizeStartSX;
      const dSY = e.clientY - resizeStartSY;
      if (resizeDirection.includes('e')) {
        // Min width accounts for text block (100px) + side column (38px) + padding (10px) + border (2px)
        const newWidth = Math.max(150, resizeStartWidth + dSX / scale);
        resizingNode.style.width = newWidth + 'px';
      }
      if (resizeDirection.includes('s')) {
        // Min height: header (24px) + body padding top/bottom (4+2=6px) + text-block margins (4px) + text content min (48px) + buffers (13px) = 95px
        const newHeight = Math.max(95, resizeStartHeight + dSY / scale);
        resizingNode.style.height = newHeight + 'px';
      }
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      draggingNodeId = null;
      if (resizing && resizingNode) {
        resizingNode.classList.remove('resizing');
      }
      resizing = false;
      resizingNode = null;
    });

    const resizeHandles = Array.from(document.querySelectorAll('.resize-handle'));
    resizeHandles.forEach(handle => {
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const node = handle.closest('.text-node');
        if (!node) return;
        resizing = true;
        resizingNode = node;
        resizeStartSX = e.clientX;
        resizeStartSY = e.clientY;
        const cs = getComputedStyle(node);
        resizeStartWidth = parseFloat(cs.width) || node.offsetWidth;
        resizeStartHeight = parseFloat(cs.height) || node.offsetHeight;
        resizeDirection = handle.dataset.direction || 'se';
        node.classList.add('resizing');
      });
    });

    function publishNodesState() {
      try {
        const payload = Object.entries(nodePos).map(([id, p]) => ({ id, x: p.x, y: p.y }));
        window.top.postMessage({ type: 'nodes:state', nodes: payload }, '*');
      } catch (_) {}
    }

    // Request saved node state from top on load
    try { window.top.postMessage({ type: 'nodes:requestState' }, '*'); } catch (_) {}

    // Apply restored nodes positions
    window.addEventListener('message', (ev) => {
      const data = ev.data || {};
      if (data.type === 'nodes:restore' && Array.isArray(data.nodes)) {
        data.nodes.forEach(n => {
          if (!n || typeof n.id !== 'string') return;
          if (typeof n.x === 'number' && typeof n.y === 'number') {
            nodePos[n.id] = { x: n.x, y: n.y };
          }
        });
        updateAllNodePositions();
      }
    });

    // Receive world transform from parent
    window.addEventListener('message', (ev) => {
      const data = ev.data || {};
      if (data.type === 'world:transform') {
        scale = data.scale;
        offsetX = data.offsetX;
        offsetY = data.offsetY;
        updateWorldTransform();
      }
    });

    // Forward wheel events to parent so zoom works over the nodes layer too
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      // Send to parent (plexus.html), not top, so it can handle zoom
      window.parent.postMessage({ type: 'world:wheel', clientX: e.clientX, clientY: e.clientY, deltaY: e.deltaY }, '*');
    }, { passive: false });

    // Any click inside nodes iframe should route focus back to the command line in the top window
    document.addEventListener('click', (e) => {
      if (editingTextBlock) return;
      if (e.target.closest('.text-block, .text-content')) return;
      try {
        window.top.postMessage({ type: 'focusCommand' }, '*');
      } catch (_) {}
    });

    // Background double-click should prefill command input with "add: "
    document.addEventListener('dblclick', (e) => {
      if (e.target.closest('.node, button, input, textarea, select, .text-block, .text-content')) return;
      try {
        window.top.postMessage({ type: 'command:prefill', value: 'add: ' }, '*');
      } catch (_) {}
    });

    // Background panning support: when clicking NOT on a node, pan the world via parent
    let bgPanning = false;
    document.addEventListener('mousedown', (e) => {
      // Ignore if starting on a node (node dragging takes priority)
      if (e.target.closest('.node')) return;
      // Only left or middle button
      if (e.button !== 0 && e.button !== 1) return;
      e.preventDefault();
      bgPanning = true;
      window.parent.postMessage({ type: 'world:panStart', clientX: e.clientX, clientY: e.clientY }, '*');
    });
    window.addEventListener('mousemove', (e) => {
      if (!bgPanning) return;
      window.parent.postMessage({ type: 'world:panMove', clientX: e.clientX, clientY: e.clientY }, '*');
    });
    window.addEventListener('mouseup', () => {
      if (!bgPanning) return;
      bgPanning = false;
      window.parent.postMessage({ type: 'world:panEnd' }, '*');
    });

    // Initial paint
  // Restore boolean state from storage before first paint
  const storedBool = readBooleanState();
  if (storedBool !== null) applyBooleanState(storedBool);

  updateWorldTransform();
  updateAllNodePositions();

    // Boolean toggle function
    function toggleBoolean(e, button) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if ((button.textContent || '').trim().toLowerCase() === 'false') {
        button.textContent = 'true';
        button.classList.add('true');
      } else {
        button.textContent = 'false';
        button.classList.remove('true');
      }
      // Persist state
      try {
        const isTrue = button.classList.contains('true');
        localStorage.setItem('boolean:node2', isTrue ? 'true' : 'false');
      } catch (_) {}
    }
  </script>
</body>
</html>
