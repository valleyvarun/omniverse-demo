<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager</title>
    <link rel="stylesheet" href="pm.css">
</head>
<body>
    <header class="pm-header">
        <button class="pm-title" id="pmStatus" type="button">Explorer</button>
        <button id="pmCollapseBtn" class="pm-collapse-btn" type="button" title="Collapse" aria-label="Collapse">−</button>
    </header>
    
    <!-- SUB-HEADER (APP NAME) -->
    <div class="pm-sub-header" id="pmSubHeader" style="display:none">
        <span id="pmAppArrow" class="pm-app-arrow">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </span>
        <button class="pm-app-name" id="pmAppName" type="button">App Name</button>
    </div>

    <!-- APP VIEW (IMAGE) -->
    <div class="pm-app-view" id="pmAppView" style="display:none">
        <img id="pmAppImage" src="" alt="App Sidebar" />
    </div>

    <main class="pm-body" id="pmBody">
        <button class="pm-btn" id="openProjectBtn" type="button">Open Project Folder</button>
        <!-- Project Manager content will go here -->
    </main>
    <script src="pm.js"></script>
</body>
</html>
