<!DOCTYPE html>
<!-- AGENT (CHATBOT IFRAME) -->
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Agent</title>
	<link rel="stylesheet" href="agent.css" />
    <link rel="stylesheet" href="agent-layers.css" />
</head>

<body>

	<!-- ROOT LAYOUT WRAPPER -->
	<div class="agent-root">

		<!-- HEADER (TOP BAR) -->
		<header class="agent-header">
			<button class="agent-status" id="agentStatus" type="button">Agent</button>
			<button id="agentCollapseBtn" class="agent-collapse-btn" type="button" title="Collapse" aria-label="Collapse" style="display:none">−</button>
		</header>

		<!-- C LAYERS HEADER -->
		<div class="agent-c-layers-header" id="agentCLayersHeader" style="display:none; cursor: pointer;">
			<span id="agentCLayersArrow" class="agent-app-arrow">
				<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="9 18 15 12 9 6"></polyline>
				</svg>
			</span>
			C Layers
		</div>

        <!-- C LAYERS CONTENT -->
        <div class="agent-c-layers-content" id="agentCLayersContent" style="display:none">
            <!-- TOOLBAR -->
            <div class="agent-c-layers-toolbar">
                <button class="layer-tool-btn" id="addLayerBtn" title="Add Layer">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="layer-tool-btn" title="Group Layers">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <button class="layer-tool-btn" id="deleteLayerBtn" title="Delete Layer">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>

            <!-- LAYERS LIST -->
            <div class="agent-c-layers-list" id="agentCLayersList">
                <div class="layer-row">
                    <span class="layer-name">Default 2D</span>
                    <div class="layer-controls">
                        <span class="icon-check">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </span>
                        <span class="icon-bulb">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"></path>
                            </svg>
                        </span>
                        <span class="icon-lock">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>
                            </svg>
                        </span>
                        <span class="color-box" style="background-color: black;"></span>
                    </div>
                </div>
                <div class="layer-row">
                    <span class="layer-name">Default 3D</span>
                    <div class="layer-controls">
                        <span class="icon-check">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </span>
                        <span class="icon-bulb">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"></path>
                            </svg>
                        </span>
                        <span class="icon-lock">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>
                            </svg>
                        </span>
                        <span class="color-box" style="background-color: #D32F2F;"></span>
                    </div>
                </div>
            </div>

            <!-- RESIZE HANDLE -->
            <div class="agent-c-layers-resize-handle" id="agentCLayersResizeHandle">
                <div class="resize-bar"></div>
            </div>
        </div>

		<!-- SUB-HEADER (APP NAME) -->
		<div class="agent-sub-header" id="agentSubHeader" style="display:none">
			<span id="agentAppArrow" class="agent-app-arrow">
				<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="9 18 15 12 9 6"></polyline>
				</svg>
			</span>
			<button class="agent-app-name" id="agentAppName" type="button">App Name</button>
		</div>

		<!-- APP VIEW (IMAGE) -->
		<div class="agent-app-view" id="agentAppView" style="display:none">
			<img id="agentAppImage" src="" alt="App Sidebar" />
		</div>

        <!-- 3D VIEW (IFRAME) -->
        <div class="agent-3d-view" id="agent3DView" style="display:none; flex: 1; overflow: hidden; background: #1a1a1a;">
            <iframe id="agent3DFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

		<!-- CHAT SCROLL AREA -->
		<main class="agent-chat" id="agentChat" aria-live="polite" aria-relevant="additions">
			<!-- Messages will be appended here -->
		</main>

		<!-- INPUT (BOTTOM BAR) -->
		<footer class="agent-input">
			<form id="agentForm" autocomplete="off">
				<!-- Top row: reference attachment button -->
				<div class="input-row top">
					<button type="button" id="addRefBtn" title="Add reference" aria-label="Add reference">
						<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
							<path fill="currentColor" d="M6 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5z"/>
						</svg>
					</button>
					<input type="file" id="refFileInput" multiple style="display:none" />
				</div>

				<!-- Middle row: main input -->
				<div class="input-row middle">
					<textarea id="chatInput" rows="1" placeholder="Type a message..." aria-label="Chat input"></textarea>
				</div>

				<!-- Bottom row: mode dropdown and send button -->
				<div class="input-row bottom">
					<select id="chatMode" aria-label="Chat mode">
						<option value="agent" selected>Agent</option>
						<option value="ask">ask</option>
					</select>
					<button type="submit" id="sendBtn" title="Send" aria-label="Send">➤</button>
				</div>
			</form>
		</footer>

	</div>

	<!-- SCRIPTS -->
	<script src="agent.js"></script>

</body>

</html>
