<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Default 3D View</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* or contain, depending on "take up whatever dimensions" usually implies cover or fill */
            display: block;
        }
    </style>
</head>
<body>
    <img src="../apps/apps-content/3d-drawing1.png" class="bg-image" alt="Default 3D View">
</body>
</html>
